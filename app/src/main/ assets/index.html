<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<title>RETRO GAMING PRO · Consolas</title>
<style>
:root{--bg:#f2f1ec;--pn:#fff;--ln:#dcdad2;--tx:#1a1b20;--mu:#6b6e79;--ac:#0b8a68;--on:#fff;--cl:90%;--ct:25%}
@media(prefers-color-scheme:dark){:root{--bg:#14151a;--pn:#1e2027;--ln:#2c2f38;--tx:#ecebe6;--mu:#8b8f9c;--ac:#5ef0c0;--on:#10201a;--cl:22%;--ct:82%}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:22px;font-weight:600;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:13px;font-weight:500;color:var(--mu);margin:20px 0 8px;display:flex;justify-content:space-between}
button,select{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{border:1px solid var(--ln);background:transparent;border-radius:18px;padding:7px 13px;white-space:nowrap;min-height:36px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{border:0;padding:0;background:none;text-align:left}
.art{aspect-ratio:3/4;border-radius:10px;background:hsl(var(--h) 45% var(--cl));color:hsl(var(--h) 40% var(--ct));display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:20px;letter-spacing:-.03em}
.card b{display:block;font-weight:500;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mu);font-size:11px}
.empty{border:1px dashed var(--ln);border-radius:12px;padding:28px 18px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.rev{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);padding:8px 0;font-size:13px}
.rev span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px;min-height:36px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--mu);font-size:12px;min-height:56px}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.1}
nav button.on{color:var(--ac)}
.list button{width:100%;display:flex;justify-content:space-between;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:13px 14px;margin-bottom:8px;text-align:left}
.list span{color:var(--mu)}
.stage{position:relative;width:100%;aspect-ratio:2/1;border-radius:16px;background:var(--pn);border:1px solid var(--ln);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.edit{outline:2px dashed var(--ac);outline-offset:-6px}
.ctl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border:2px solid var(--mu);color:var(--tx);font-weight:600;touch-action:none;background:transparent;opacity:var(--op,.9);width:calc(var(--s,1)*var(--w));height:calc(var(--s,1)*var(--h));font-size:calc(var(--s,1)*var(--w)*.34)}
.ctl.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ctl.btn1{--w:15%;--h:30%;border-radius:50%;width:calc(var(--s,1)*12%);height:auto;aspect-ratio:1}
.ctl.pill{--w:14%;--h:9%;border-radius:20px;font-size:calc(var(--s,1)*10px);height:calc(var(--s,1)*9%);width:calc(var(--s,1)*14%)}
.ctl.sh{border-radius:8px;width:calc(var(--s,1)*15%);height:calc(var(--s,1)*11%);font-size:calc(var(--s,1)*11px)}
.ctl.stick{border-radius:50%;width:calc(var(--s,1)*22%);aspect-ratio:1;height:auto;border-style:dashed}
.ctl.stick::after{content:"";width:46%;aspect-ratio:1;border-radius:50%;background:var(--mu);opacity:.7}
.ctl.stick.on::after{background:var(--on)}
.ctl.dpad{width:calc(var(--s,1)*21%);aspect-ratio:1;height:auto;border:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:0}
.ctl.dpad i{border:2px solid var(--mu);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}
.ctl.dpad.on{background:transparent}
.ctl.dpad.on i{border-color:var(--ac);color:var(--ac)}
.set{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin:16px 0;font-size:13px;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--ac)}
.note{font-size:13px;color:var(--mu);margin:12px 0 0}
#play{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px 14px;max-width:760px;margin:0 auto}
#play.show{display:flex}
#play .stage{margin-top:12px}
.scr{flex:1;min-height:120px;border-radius:12px;background:#000;overflow:hidden;position:relative;margin-top:10px}.scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(orientation:landscape)and(max-height:560px){#play{padding:6px;max-width:none}#play .scr{margin:0;border-radius:0}#play .bar{position:absolute;top:6px;left:6px;right:6px;z-index:3;opacity:.85}#play .stage{position:absolute;inset:0;width:auto;aspect-ratio:auto;background:transparent;border:0;border-radius:0;margin:0;z-index:2;pointer-events:none}#play .stage .ctl{pointer-events:auto}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <main id="v"></main>
  <nav id="nav">
    <button data-t="lib"><i>▦</i>Biblioteca</button>
    <button data-t="con"><i>◉</i>Consolas</button>
    <button data-t="ctl"><i>✥</i>Controles</button>
  </nav>
</div>
<div id="play"></div>
<input id="f1" type="file" multiple hidden>
<input id="f2" type="file" webkitdirectory multiple hidden>

<script>
const D=['▲','◀','','▶','▼'];
const CORE={nes:'nes',snes:'snes',gb:'gb',gba:'gba',n64:'n64',gen:'segaMD',ps1:'psx',arc:'arcade'};
const BM={A:8,B:0,X:9,Y:1,L:10,R:11,L1:10,R1:11,L2:12,R2:13,Z:12,Select:2,Start:3,Coin:2,'✕':0,'○':8,'□':1,'△':9,'1':0,'2':8,'3':1,'4':9,'5':10,'6':11};
const OV={n64:{A:0,B:1},gen:{A:1,B:0,C:8}},CB={'▲':23,'▼':22,'◀':21,'▶':20};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db;const idb=()=>db||(db=new Promise((ok,no)=>{const q=indexedDB.open('arcadia',1);q.onupgradeneeded=()=>q.result.createObjectStore('roms');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const io=async(m,f,...a)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('roms',m),q=t.objectStore('roms')[f](...a);t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};
let frame=null;
const L={
nes:{n:'NES',b:'Nintendo',h:0,e:['nes'],k:'nes,famicom,fc',c:[['dpad','',16,55],['pill','Select',40,80],['pill','Start',56,80],['btn1','B',74,62],['btn1','A',89,50]]},
snes:{n:'SNES',b:'Nintendo',h:265,e:['sfc','smc'],k:'snes,super nintendo,super famicom',c:[['sh','L',12,13],['sh','R',88,13],['dpad','',16,58],['pill','Select',40,82],['pill','Start',56,82],['btn1','X',82,30],['btn1','Y',72,52],['btn1','A',92,52],['btn1','B',82,74]]},
gb:{n:'Game Boy',b:'Nintendo',h:95,e:['gb','gbc'],k:'gameboy,game boy,gbc',c:[['dpad','',16,55],['btn1','B',74,62],['btn1','A',89,50],['pill','Select',40,85],['pill','Start',56,85]]},
gba:{n:'GBA',b:'Nintendo',h:285,e:['gba'],k:'gba,advance',c:[['sh','L',11,12],['sh','R',89,12],['dpad','',15,56],['btn1','B',76,64],['btn1','A',90,48],['pill','Select',38,88],['pill','Start',62,88]]},
n64:{n:'N64',b:'Nintendo',h:150,e:['z64','n64','v64'],k:'n64,nintendo 64',c:[['sh','L',12,12],['sh','Z',34,12],['sh','R',88,12],['stick','',17,58],['pill','Start',50,52],['btn1','B',56,70],['btn1','A',68,58],['btn1','▲',88,32],['btn1','◀',79,50],['btn1','▶',97,50],['btn1','▼',88,68]]},
gen:{n:'Genesis',b:'Sega',h:210,e:['gen','md','smd'],k:'genesis,mega drive,megadrive,sega',c:[['dpad','',16,55],['pill','Start',50,84],['btn1','A',66,64],['btn1','B',78,52],['btn1','C',90,40]]},
ps1:{n:'PlayStation',b:'Sony',h:225,e:['cue','chd','pbp'],k:'psx,ps1,playstation',c:[['sh','L2',10,9],['sh','L1',10,24],['sh','R2',90,9],['sh','R1',90,24],['dpad','',14,60],['pill','Select',40,84],['pill','Start',60,84],['btn1','△',84,34],['btn1','□',74,54],['btn1','○',94,54],['btn1','✕',84,74],['stick','',36,60],['stick','',64,60]]},
arc:{n:'Arcade',b:'Arcade',h:35,e:[],k:'arcade,mame,fba,neogeo,neo geo',c:[['stick','',17,56],['btn1','1',50,40],['btn1','2',62,35],['btn1','3',74,35],['btn1','4',50,66],['btn1','5',62,61],['btn1','6',74,61],['pill','Coin',40,90],['pill','Start',58,90]]}
};
const X={};for(const k in L)L[k].e.forEach(e=>X[e]=k);
L.psp={n:'PSP',b:'Sony',h:215,e:['cso'],k:'psp,playstation portable',c:[['sh','L',12,12],['sh','R',88,12],['dpad','',15,56],['stick','',33,75],['pill','Select',43,90],['pill','Start',58,90],['btn1','△',84,34],['btn1','□',74,54],['btn1','○',94,54],['btn1','✕',84,74]]};
L.ps2={n:'PlayStation 2',b:'Sony',h:230,e:[],k:'ps2,playstation 2',c:L.ps1.c};
X.cso='psp';
const AMB=['iso','bin','zip','7z'];
const st=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let games=st('g',[]),pos=st('p',{}),cfg=st('c',{s:1,o:.9}),tab='lib',flt='all',cur='snes',edit=false;
const $=s=>document.querySelector(s);

function clean(n){return n.replace(/\.[^.]+$/,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()}
function detect(f){
  const p=(f.webkitRelativePath||f.name).toLowerCase(),ext=p.split('.').pop();
  if(X[ext])return X[ext];
  for(const k in L)if(L[k].k.split(',').some(w=>p.split('/').slice(0,-1).join('/').includes(w)))return k;
  if(ext==='iso' && /psp|portable/.test(p))return 'psp';
  if(ext==='iso' && /ps2|playstation 2/.test(p))return 'ps2';
  return null;
}
async function scan(files){
  let add=0;const seen=new Set(games.map(g=>g.key));
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    if(!X[ext]&&!AMB.includes(ext))continue;
    if(f.size > 700 * 1024 * 1024){toast('Archivo demasiado grande para la biblioteca web: '+f.name);continue;}
    const key=(f.webkitRelativePath||f.name)+'|'+f.size;
    if(seen.has(key))continue;
    const id='g'+Date.now()+Math.random().toString(36).slice(2,6);
    toast('Importando '+clean(f.name)+'…');
    try{await io('readwrite','put',f,id)}catch(e){toast('No se pudo guardar '+f.name);continue}
    games.push({id,key,name:clean(f.name),fname:f.name,con:detect(f)});add++;
  }
  sv('g',games);render();
  toast(add?add+' juegos agregados':'No se encontraron juegos nuevos');
}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function card(g){const c=L[g.con]||{h:0,n:'Revisar'};return `<button class="card" data-id="${g.id}"><div class="art" style="--h:${c.h}">${c.n.slice(0,4)}</div><b>${esc(g.name)}</b><small>${c.n}</small></button>`}
function viewLib(){
  const ok=games.filter(g=>g.con),rev=games.filter(g=>!g.con);
  const brands=['all',...new Set(ok.map(g=>L[g.con].b))];
  const shown=ok.filter(g=>flt==='all'||L[g.con].b===flt);
  let h=`<h1>RETRO GAMING PRO</h1><p class="note">Biblioteca local · Consolas · Controles</p><div class="row" style="margin:10px 0"><button class="btn g" id="webrom">Abrir catálogo legal de juegos</button></div>`;
  if(!games.length)return h+`<div class="empty"><b>Agrega tu primer juego</b>Elige una carpeta o archivos y la consola se detecta sola.<div class="row" style="justify-content:center"><button class="btn" id="b2">Escanear carpeta</button><button class="btn g" id="b1">Elegir archivos</button></div></div><p class="note">Los archivos se copian al almacenamiento privado de la app y no se suben a ningún servidor. Mantén presionado un juego para quitarlo.</p>`;
  h+=`<div class="row" style="margin-bottom:12px"><button class="btn" id="b2">Escanear carpeta</button><button class="btn g" id="b1">Elegir archivos</button></div>`;
  h+=`<div class="chips">${brands.map(b=>`<button class="chip ${b===flt?'on':''}" data-f="${b}">${b==='all'?'Todas':b}</button>`).join('')}</div>`;
  h+=`<h2><span>Todos los juegos</span><span>${shown.length}</span></h2><div class="grid">${shown.map(card).join('')}</div>`;
  if(rev.length)h+=`<h2><span>Por revisar</span><span>${rev.length}</span></h2>`+rev.map(g=>`<div class="rev"><span>${esc(g.name)}</span><select data-r="${g.id}"><option value="">Consola…</option>${Object.keys(L).map(k=>`<option value="${k}">${L[k].n}</option>`).join('')}</select></div>`).join('');
  return h;
}
function viewCon(){
  return `<h1>Consolas</h1><p class="note">PSP y PS2 requieren motores nativos que aún no están integrados en esta versión de prueba.</p><div class="list">${Object.keys(L).map(k=>`<button data-c="${k}"><div>${L[k].n}<br><small style="color:var(--mu)">${L[k].b}</small></div><span>${games.filter(g=>g.con===k).length} juegos</span></button>`).join('')}</div>`;
}
function stageHTML(k){
  const p=pos[k]||{};
  let ns=0;
  return L[k].c.map((c,i)=>{
    const [t,l,x,y]=c,q=p[i]||[x,y];
    const inner=t==='dpad'?D.map(d=>`<i>${d}</i>`).join(''):t==='stick'?'':l;
    const sd=t==='stick'?` data-st="${ns++}"`:'';
    return `<div class="ctl ${t}" data-i="${i}"${sd} style="left:${q[0]}%;top:${q[1]}%">${inner}</div>`;
  }).join('');
}
function sim(i,v){try{frame.contentWindow.EJS_emulator.gameManager.simulateInput(0,i,v)}catch(e){}}
function idxOf(k,lb){if(k==='n64'&&CB[lb]!==undefined)return CB[lb];const o=OV[k];if(o&&lb in o)return o[lb];return BM[lb]}
function out(n,m){const o=n._o||{};for(const q in o)if(!(q in m))sim(+q,0);for(const q in m)if(o[q]!==m[q])sim(+q,m[q]);n._o=m}
function feed(n,e,on,k){
  const c=L[k].c[+n.dataset.i],t=c[0],m={};
  if(on){
    if(t==='dpad'||t==='stick'){
      const r=n.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
      if(t==='dpad'){if(dy<-.3)m[4]=1;if(dy>.3)m[5]=1;if(dx<-.3)m[6]=1;if(dx>.3)m[7]=1}
      else{const b=n.dataset.st==='1'?20:16,x=Math.max(-1,Math.min(1,dx)),y=Math.max(-1,Math.min(1,dy)),v=z=>Math.round(Math.abs(z)*32767);
        if(x>.15)m[b]=v(x);if(x<-.15)m[b+1]=v(x);if(y>.15)m[b+2]=v(y);if(y<-.15)m[b+3]=v(y)}
    }else{const i=idxOf(k,c[1]);if(i!==undefined)m[i]=i>=16?32767:1}
  }
  out(n,m);
}
function bind(el,k,live){
  el.style.setProperty('--s',cfg.s);el.style.setProperty('--op',cfg.o);
  el.classList.toggle('edit',edit);
  el.querySelectorAll('.ctl').forEach(n=>{
    const i=+n.dataset.i;
    n.addEventListener('pointerdown',e=>{e.preventDefault();n.setPointerCapture(e.pointerId);n.classList.add('on');if(!edit){if(navigator.vibrate)navigator.vibrate(8);if(live)feed(n,e,true,k)}});
    n.addEventListener('pointermove',e=>{
      if(!n.classList.contains('on'))return;
      if(!edit){if(live)feed(n,e,true,k);return}
      const r=el.getBoundingClientRect();
      const x=Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),y=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100));
      n.style.left=x+'%';n.style.top=y+'%';
      (pos[k]=pos[k]||{})[i]=[+x.toFixed(1),+y.toFixed(1)];
    });
    const up=e=>{n.classList.remove('on');if(edit)sv('p',pos);else if(live)feed(n,e,false,k)};
    n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);
  });
}
function viewCtl(){
  return `<h1>Controles</h1><div class="chips">${Object.keys(L).map(k=>`<button class="chip ${k===cur?'on':''}" data-k="${k}">${L[k].n}</button>`).join('')}</div>
  <div class="stage" id="stg">${stageHTML(cur)}</div>
  <div class="set"><label>Tamaño</label><input type="range" id="rs" min=".7" max="1.4" step=".05" value="${cfg.s}"><label>Opacidad</label><input type="range" id="ro" min=".3" max="1" step=".05" value="${cfg.o}"></div>
  <div class="row"><button class="btn ${edit?'':'g'}" id="be">${edit?'Listo':'Mover botones'}</button><button class="btn g" id="br">Restablecer</button></div>
  <p class="note">Toca los botones para probarlos. Con “Mover botones” puedes arrastrarlos; la posición se guarda por consola.</p>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#v').innerHTML=tab==='lib'?viewLib():tab==='con'?viewCon():viewCtl();
  if(tab==='ctl')bind($('#stg'),cur);
}
async function openGame(id){
  const g=games.find(x=>x.id===id),k=g.con;
   if(!CORE[k]){alert('El motor de '+L[k].n+' no está integrado. Esta versión permite catalogar el juego, pero todavía no ejecutarlo.');return;}
  let blob;try{blob=await io('readonly','get',id)}catch(e){}
  if(!blob){toast('No se encontró el archivo. Impórtalo de nuevo.');return}
  window.__rom=new File([blob],g.fname||g.name);
  $('#play').innerHTML=`<div class="bar"><button class="btn g" id="px">Salir</button><b>${esc(g.name)}</b><span class="row"><button class="btn g" id="qs">Guardar</button><button class="btn g" id="ql">Cargar</button><button class="btn g" id="pe">Mover</button></span></div><div class="scr" id="scr"></div><div class="stage" id="ps">${stageHTML(k)}</div>`;
  $('#play').classList.add('show');
  const fr=document.createElement('iframe');frame=fr;fr.allow='autoplay; gamepad; fullscreen';
  fr.srcdoc=`<!DOCTYPE html><html><body style="margin:0;background:#000"><div id="game" style="width:100vw;height:100vh"></div><style>.ejs_virtual_gamepad{display:none!important}</style><script>EJS_player='#game';EJS_core='${CORE[k]}';EJS_gameUrl=parent.__rom;EJS_gameName=${JSON.stringify('RETRO GAMING PRO')};EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';EJS_startOnLoaded=true;EJS_color='#0b8a68';<\/script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script></body></html>`;
  $('#scr').appendChild(fr);
  const s=$('#ps');bind(s,k,true);
  const gm=()=>frame.contentWindow.EJS_emulator.gameManager;
  $('#px').onclick=()=>{edit=false;fr.remove();frame=null;window.__rom=null;$('#play').classList.remove('show')};
  $('#qs').onclick=()=>{try{gm().quickSave(0);toast('Estado guardado')}catch(e){toast('Espera a que cargue el juego')}};
  $('#ql').onclick=()=>{try{gm().quickLoad(0)}catch(e){toast('Espera a que cargue el juego')}};
  $('#pe').onclick=()=>{edit=!edit;s.classList.toggle('edit',edit);$('#pe').textContent=edit?'Listo':'Mover'};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-c]');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;edit=false;render()}
  else if(t.id==='webrom'){const u=prompt('URL HTTPS del catálogo de juegos autorizados:');if(u){try{const v=new URL(u);if(v.protocol==='https:')window.open(v.href,'_blank');else toast('Utiliza un enlace HTTPS');}catch(e){toast('Enlace no válido')}}}
   else if(t.id==='b1')$('#f1').click();
  else if(t.id==='b2'){if(window.AndroidFolder)AndroidFolder.selectFolder();else $('#f2').click();}
  else if(t.dataset.f){flt=t.dataset.f;render()}
  else if(t.dataset.id)openGame(t.dataset.id);
  else if(t.dataset.c){cur=t.dataset.c;tab='ctl';render()}
  else if(t.dataset.k){cur=t.dataset.k;render()}
  else if(t.id==='be'){edit=!edit;render()}
  else if(t.id==='br'){delete pos[cur];sv('p',pos);render()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.r){const g=games.find(x=>x.id===e.target.dataset.r);if(g&&e.target.value){g.con=e.target.value;sv('g',games);render()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rs'||e.target.id==='ro'){
    cfg=e.target.id==='rs'?{...cfg,s:+e.target.value}:{...cfg,o:+e.target.value};sv('c',cfg);
    const s=$('#stg');s.style.setProperty('--s',cfg.s);s.style.setProperty('--op',cfg.o);
  }
});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.card');if(!c)return;e.preventDefault();const g=games.find(x=>x.id===c.dataset.id);if(g&&confirm('¿Quitar "'+g.name+'" de la biblioteca?')){io('readwrite','delete',g.id).catch(()=>{});games=games.filter(x=>x!==g);sv('g',games);render()}});
window.receiveAndroidFolder=async function(items){
  if(!items.length){toast('No se encontraron juegos compatibles en la carpeta');return;}
  toast('Encontrados '+items.length+' archivos. Importando...');
  let imported=0,failed=0;
  for(const item of items){
    try{
      const res=await fetch(item.url);
      if(!res.ok)throw Error('No se pudo leer');
      const blob=await res.blob();
      const file=new File([blob],item.name,{type:'application/octet-stream'});
      const before=games.length;
      await scan([file]);
      if(games.length>before)imported++;
    }catch(e){failed++;}
  }
  toast('Carpeta procesada: '+imported+' agregados, '+failed+' errores');
};
['f1','f2'].forEach(id=>$('#'+id).addEventListener('change',e=>{scan([...e.target.files]);e.target.value=''}));
render();
</script>
</body>
</html>
